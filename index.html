<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTWE</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F5F5F7;
            --text: #4B3621;
            --logo-filter: invert(18%) sepia(16%) saturate(1451%) hue-rotate(345deg) brightness(95%) contrast(92%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #B8860B;
                --logo-filter: invert(56%) sepia(87%) saturate(350%) hue-rotate(5deg) brightness(70%) contrast(110%);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.6s ease;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            animation: fadeIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: var(--logo-filter);
            margin-bottom: 25px;
            transition: filter 0.5s ease;
        }

        p {
            font-size: 0.9rem;
            opacity: 0.5;
            margin-top: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
        }

        .contact {
            margin-top: 50px;
            font-size: 0.85rem;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 25px;
        }

        @media (prefers-color-scheme: dark) {
            .contact { border-color: rgba(255,255,255,0.12); }
        }

        a {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            text-decoration: none;
            font-weight: 400;
            opacity: 0.7;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        a:hover {
            opacity: 1;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.svg" alt="ESTWE" class="logo">
        
        <p>We exist. Soon.</p>
        
        <div class="contact">
            <a href="mailto:info@estwe.com">info@estwe.com</a>
        </div>
    </div>
</body>
</html>
