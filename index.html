<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTWE</title>
    <style>
        :root {
            --bg: #F5F5F7;
            --text: #4B3621;
            --logo-filter: invert(18%) sepia(16%) saturate(1451%) hue-rotate(345deg) brightness(95%) contrast(92%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #B8860B;
                --logo-filter: invert(56%) sepia(87%) saturate(415%) hue-rotate(5deg) brightness(91%) contrast(89%);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.5s ease;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        .logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: var(--logo-filter);
            margin-bottom: 20px;
            transition: filter 0.5s ease;
        }

        p {
            font-size: 1rem;
            opacity: 0.6;
            margin-top: 10px;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        .contact {
            margin-top: 40px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 20px;
        }

        @media (prefers-color-scheme: dark) {
            .contact { border-color: rgba(255,255,255,0.1); }
        }

        a {
            color: var(--text);
            text-decoration: none;
            font-weight: 400;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.svg" alt="ESTWE" class="logo">
        
        <p>We exist. Soon.</p>
        
        <div class="contact">
            <a href="mailto:info@estwe.com">info@estwe.com</a>
        </div>
    </div>
</body>
</html>
