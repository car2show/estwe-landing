<style>
:root {
  --bg: #000;
  --text: #C5A059;
  --text-dim: rgba(197,160,89,0.55);
  --border: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at 50% 20%, rgba(197,160,89,0.08), transparent 60%), #000;
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  text-align: center;
  max-width: 360px;
  padding: 24px;
}

.logo-wrap {
  position: relative;
  display: inline-block;
}

.logo-wrap::before {
  content: "";
  position: absolute;
  inset: -60px;
  background: radial-gradient(circle, rgba(197,160,89,0.15), transparent 70%);
  z-index: -1;
  pointer-events: none;
}

.logo {
  width: 100%;
  fill: currentColor;
  opacity: 0;
  transform: translateY(12px);
  shape-rendering: geometricPrecision;
  animation:
    reveal 1.2s cubic-bezier(0.22,1,0.36,1) forwards,
    glow 6s ease-in-out infinite 1.2s;
}

h1 {
  font-size: 0.75rem;
  font-weight: 400;
  opacity: 0.6;
  letter-spacing: 0.6em;
  text-transform: uppercase;
  margin-top: 24px;
}

.contact {
  margin-top: 55px;
  border-top: 1px solid var(--border);
  padding-top: 28px;
}

.mail-link {
  font-size: 0.85rem;
  opacity: 0.5;
  letter-spacing: 0.08em;
  transition: all 0.3s ease;
}

@media (hover: hover) {
  .mail-link:hover {
    opacity: 1;
    transform: translateY(-1px);
    text-shadow: 0 0 8px rgba(197,160,89,0.35);
  }
}

.socials {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-top: 18px;
}

.socials a {
  padding: 6px;
}

.social-icon {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  stroke-width: 1.6;
  fill: none;
  opacity: 0.4;
  transition: all 0.3s ease;
}

@media (hover: hover) {
  .socials a:hover .social-icon {
    opacity: 1;
    transform: translateY(-2px);
    filter: drop-shadow(0 0 8px rgba(197,160,89,0.45));
  }
}

@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes glow {
  0%   { filter: drop-shadow(0 0 2px rgba(197,160,89,0.1)); }
  50%  { filter: drop-shadow(0 0 18px rgba(197,160,89,0.35)); }
  100% { filter: drop-shadow(0 0 2px rgba(197,160,89,0.1)); }
}

@media (prefers-reduced-motion: reduce) {
  .logo {
    animation: none;
    opacity: 1;
    transform: none;
  }
}
</style>
</head>
