<style>
:root {
  --bg: #000;
  --text: #C5A059;
  --border: rgba(255,255,255,0.08);
}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  text-align: center;
  max-width: 340px;
  padding: 20px;
}


.logo-wrap {
  position: relative;
  display: inline-block;
  overflow: hidden;
}

.logo {
  width: 100%;
  fill: currentColor;
  opacity: 0;
  transform: translateY(10px);
  animation:
    reveal 1.2s cubic-bezier(0.22,1,0.36,1) forwards,
    glow 5s ease-in-out infinite 1.2s;
}

.logo-wrap::after {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.12),
    transparent
  );
  transform: skewX(-20deg);
  animation: shine 2.5s ease forwards 1s;
}

p {
  font-size: 0.75rem;
  opacity: 0.5;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  margin-top: 20px;
}


.contact {
  margin-top: 60px;
  border-top: 1px solid var(--border);
  padding-top: 25px;
}

.mail-link {
  font-size: 0.8rem;
  opacity: 0.45;
  letter-spacing: 0.05em;
  transition: all 0.3s ease;
}

.mail-link:hover {
  opacity: 0.9;
  transform: translateY(-1px);
  text-shadow: 0 0 6px rgba(197,160,89,0.25);
}


.socials {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 10px;
}

.socials a {
  display: flex;
  align-items: center;
  justify-content: center;
}

.social-icon {
  width: 20px;
  height: 20px;
  fill: currentColor;
  opacity: 0.35;

  transform: translateZ(0);
  will-change: transform, opacity;
  backface-visibility: hidden;

  animation: iconPulse 7.1s ease-in-out infinite;
}

.socials a:hover .social-icon {
  opacity: 1;
  transform: translateY(-2px);
  filter: drop-shadow(0 0 8px rgba(197,160,89,0.45));

  animation-play-state: paused;
}

.socials a:nth-child(1) { transition-delay: 0.02s; }
.socials a:nth-child(2) { transition-delay: 0.05s; }
.socials a:nth-child(3) { transition-delay: 0.08s; }


@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes glow {
  0%   { filter: drop-shadow(0 0 2px rgba(197,160,89,0.1)); }
  50%  { filter: drop-shadow(0 0 16px rgba(197,160,89,0.35)); }
  100% { filter: drop-shadow(0 0 2px rgba(197,160,89,0.1)); }
}

@keyframes iconPulse {
  0%, 90%, 100% {
    transform: translateY(0);
    opacity: 0.35;
  }
  95% {
    transform: translateY(-1.5px);
    opacity: 0.65;
  }
}

@keyframes shine {
  0% { left: -120%; opacity: 0; }
  30% { opacity: 1; }
  100% { left: 120%; opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .logo,
  .social-icon,
  .logo-wrap::after {
    animation: none;
    transform: none;
    opacity: 1;
  }
}
</style>
</head>
