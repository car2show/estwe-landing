<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>ESTWE</title>
<meta name="description" content="ESTWE — modern creative project. Coming soon.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico">

<style>
    :root {
        --bg: #F5F5F7;
        --text: #2C2C2E;
        --line: rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #000;
            --text: #E5E5E7;
            --line: rgba(255,255,255,0.1);
        }
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    main {
        text-align: center;
        padding: 40px 20px;
        max-width: 420px;
        width: 100%;
        animation: fadeIn 1.2s ease;
    }

    .logo {
        width: 100%;
        max-width: 320px;
        margin-bottom: 30px;
        filter: drop-shadow(0 10px 30px rgba(0,0,0,0.08));
        transition: transform 0.8s ease, filter 0.8s ease;
    }

    .logo:hover {
        transform: scale(1.02);
        filter: drop-shadow(0 20px 60px rgba(0,0,0,0.12));
    }

    p {
        font-size: 0.8rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.6;
        margin: 0;
    }

    .contact {
        margin-top: 60px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
    }

    a {
        color: var(--text);
        text-decoration: none;
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        opacity: 0.6;
        transition: all 0.4s ease;
        position: relative;
    }

    a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 0%;
        height: 1px;
        background: var(--text);
        transition: width 0.4s ease;
    }

    a:hover {
        opacity: 1;
        letter-spacing: 0.3em;
    }

    a:hover::after {
        width: 100%;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* скрытый SEO текст */
    .seo {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }
</style>
```

</head>

<body>

<main>

```
<h1 class="seo">ESTWE</h1>

<img src="logo.svg" alt="ESTWE logo" class="logo">

<p>We exist. Soon.</p>

    <a href="mailto:info@estwe.com">info@estwe.com</a>
</div>

<p class="seo">
    ESTWE — modern creative brand. Coming soon.
</p>
```

</main>
