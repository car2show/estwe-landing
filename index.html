<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESTWE</title>

    <meta name="description" content="We exist. Soon.">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000;
            --text: #C5A059;
            --border: rgba(255,255,255,0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(197,160,89,0.08),
                    transparent 60%
                ),
                var(--bg);

            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .container {
            flex: 1;

            width: 100%;
            max-width: 420px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 32px 24px;
        }

        .logo-wrap {
            position: relative;
            display: inline-block;
        }

        .logo-wrap::before {
            content: "";

            position: absolute;
            inset: -60px;

            background:
                radial-gradient(
                    circle,
                    rgba(197,160,89,0.15),
                    transparent 70%
                );

            z-index: -1;
            pointer-events: none;
        }

        .logo {
            width: 260px;
            max-width: 80vw;

            fill: currentColor;

            opacity: 0;

            transform:
                translateY(12px)
                translateZ(0);

            will-change: transform, filter;

            backface-visibility: hidden;

            animation:
                reveal 1.2s cubic-bezier(0.22,1,0.36,1) forwards,
                glow 5s ease-in-out infinite 1.2s;
        }

        .tagline {
            margin-top: 34px;

            font-size: 0.75rem;
            font-weight: 400;

            letter-spacing: 0.62em;
            text-transform: uppercase;

            opacity: 0.58;
        }

        .contact {
            width: 100%;

            display: flex;
            justify-content: center;

            padding-bottom: 34px;
        }

        .socials {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 28px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            background: none;
            border: none;

            color: var(--text);

            cursor: pointer;
            text-decoration: none;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-2px);
        }

        .social-link:focus-visible {
            outline: 1px solid rgba(197,160,89,0.5);
            outline-offset: 6px;
            border-radius: 999px;
        }

        .social-icon {
            width: 20px;
            height: 20px;

            fill: var(--text);

            opacity: 0.32;

            transition:
                opacity 0.3s ease,
                filter 0.3s ease;
        }

        .social-link:hover .social-icon,
        .social-link:focus-visible .social-icon {
            opacity: 1;

            filter:
                drop-shadow(0 0 8px rgba(197,160,89,0.35));
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform:
                    translateY(0)
                    translateZ(0);
            }
        }

        @keyframes glow {
            0%,
            100% {
                filter:
                    drop-shadow(0 0 4px rgba(197,160,89,0.14));
            }

            50% {
                filter:
                    drop-shadow(0 0 10px rgba(197,160,89,0.22))
                    drop-shadow(0 0 22px rgba(197,160,89,0.12));
            }
        }

        @media (max-width: 480px) {
            .logo {
                width: 230px;
            }

            .tagline {
                margin-top: 30px;

                font-size: 0.72rem;
                letter-spacing: 0.48em;
            }

            .socials {
                gap: 24px;
            }
        }
    </style>
</head>
