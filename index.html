<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTWE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #000;
  --text: #C5A059;
}

body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

/* контейнер */
.container {
  text-align: center;
  max-width: 340px;
  padding: 20px;
}

/* reveal */
.logo {
  opacity: 0;
  transform: translateY(10px) scale(0.98);
  animation:
    reveal 1.6s cubic-bezier(0.22,1,0.36,1) forwards,
    glow 6s cubic-bezier(0.4,0,0.2,1) infinite 1.6s,
    breathe 6s ease-in-out infinite 1.6s;
}

/* текст */
p {
  margin: 20px 0 0;
  font-size: 0.8rem;
  letter-spacing: 0.4em;
  opacity: 0.6;
}

/* анимации */
@keyframes reveal {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes glow {
  0%   { filter: drop-shadow(0 0 2px rgba(197,160,89,0.15)); }
  25%  { filter: drop-shadow(0 0 10px rgba(197,160,89,0.25)); }
  50%  { filter: drop-shadow(0 0 18px rgba(197,160,89,0.4)); }
  75%  { filter: drop-shadow(0 0 10px rgba(197,160,89,0.25)); }
  100% { filter: drop-shadow(0 0 2px rgba(197,160,89,0.15)); }
}

@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.01); }
}

/* доступность */
@media (prefers-reduced-motion: reduce) {
  .logo {
    animation: none;
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body>
<main class="container">
