        a { color: var(--text); text-decoration: none; opacity: 0.7; transition: 0.3s; }
        a:hover { opacity: 1; letter-spacing: 0.1em; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
