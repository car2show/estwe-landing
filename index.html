    <style>
        :root { --bg: #F5F5F7; --text: #4B3621; --border: rgba(128, 128, 128, 0.1); }
        @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #DAA520; } }
        
        body {
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; margin: 0; background: var(--bg); color: var(--text);
            -webkit-font-smoothing: antialiased; overflow: hidden;
        }

        .container { text-align: center; padding: 20px; width: 100%; max-width: 320px; }

        .fade-in { 
            opacity: 0; transform: translateY(10px); 
            animation: slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }

        .logo-svg { width: 100%; fill: var(--text); margin-bottom: 20px; transition: 0.8s; }

        p { font-size: 0.75rem; opacity: 0.5; letter-spacing: 0.5em; text-transform: uppercase; font-weight: 300; margin: 0; }

        .contact { margin-top: 50px; border-top: 1px solid var(--border); padding-top: 25px; }
        
        .mail-link { 
            display: block; font-size: 0.85rem; text-decoration: none; color: var(--text); 
            opacity: 0.5; transition: 0.3s; margin-bottom: 25px; 
        }
        .mail-link:hover { opacity: 1; }

        .socials { display: flex; justify-content: center; gap: 25px; }
        .social-icon { fill: var(--text); opacity: 0.4; transition: 0.3s; width: 20px; height: 20px; display: block; }
        .social-icon:hover { opacity: 1; transform: translateY(-2px); }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
