<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTWE</title>
    <meta name="description" content="ESTWE — We exist. Soon.">

    <!-- SEO / Social -->
    <meta property="og:title" content="ESTWE">
    <meta property="og:description" content="We exist. Soon.">
    <meta property="og:type" content="website">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F5F5F7;
            --text: #C5A059;
            --muted: rgba(197, 160, 89, 0.5);
            --border: rgba(128,128,128,0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000;
                --text: #C5A059;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            padding: 24px;
            width: 100%;
            max-width: 340px;
        }

        /* Animations */

        .fade-in {
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 0.8s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */

        .logo-svg {
            width: 100%;
            fill: var(--text);
            margin-bottom: 24px;
            animation:
                fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                glow 6s ease-in-out infinite 1.4s;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 0 rgba(197,160,89,0)); }
            50% { filter: drop-shadow(0 0 18px rgba(197,160,89,0.45)); }
        }

        /* Text */

        p {
            font-size: 0.78rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            font-weight: 300;
            margin: 0;
            color: var(--muted);
        }

        /* Footer */

        .contact {
            margin-top: 56px;
            border-top: 1px solid var(--border);
            padding-top: 28px;
        }

        .mail-link {
            display: inline-block;
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--text);
            opacity: 0.6;
            transition: 0.3s;
            margin-bottom: 28px;
        }

        .mail-link:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 28px;
        }

        .social-icon {
            fill: var(--text);
            opacity: 0.4;
            transition: 0.3s;
            width: 20px;
            height: 20px;
        }

        .social-icon:hover {
            opacity: 1;
            transform: translateY(-2px) scale(1.05);
        }

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<main class="container">
    <div class="fade-in delay-1">
        <svg class="logo-svg" role="img" aria-labelledby="logo-title" viewBox="0 -150 1800 1450">
            <title id="logo-title">ESTWE</title>
            <!-- твой path без изменений -->
        </svg>
    </div>

    <div class="fade-in delay-2">
        <p>We exist. Soon.</p>
    </div>

    <footer class="contact fade-in delay-3">
        <a href="mailto:info@estwe.com" class="mail-link">info@estwe.com</a>

        <div class="socials">
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <!-- svg -->
            </a>

            <a href="https://x.com" target="_blank" rel="noopener noreferrer" aria-label="X">
                <!-- svg -->
            </a>

            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <!-- svg -->
            </a>
        </div>
    </footer>
</main>

</body>
</html>
