    <meta name="theme-color" content="#000000">

    <meta property="og:title" content="ESTWE">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #000;
            --text: #C5A059;
            --border: rgba(255,255,255,0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            min-height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(197,160,89,0.08),
                    transparent 60%
                ),
                var(--bg);

            color: var(--text);
            font-family: 'Inter', sans-serif;

            animation: pageFade 1s ease;
        }

        body::after {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: 0.03;

            background-image:
                radial-gradient(rgba(255,255,255,0.5) 0.5px, transparent 0.5px);

            background-size: 3px 3px;
        }

        .container {
            flex: 1;

            width: 100%;
            max-width: 520px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 32px 24px;
        }

        .logo-wrap {
            position: relative;
            display: inline-block;
        }

        .logo-wrap::before {
            content: "";

            position: absolute;
            inset: -60px;

            background:
                radial-gradient(
                    circle,
                    rgba(197,160,89,0.15),
                    transparent 70%
                );

            z-index: -1;
            pointer-events: none;
        }

        .logo {
            width: 260px;
            max-width: 80vw;

            fill: currentColor;

            opacity: 0;

            transform:
                translateY(12px)
                translateZ(0);

            will-change: transform, filter;

            backface-visibility: hidden;

            animation:
                reveal 1.2s cubic-bezier(0.22,1,0.36,1) forwards,
                glow 5s ease-in-out infinite 1.2s,
                float 8s ease-in-out infinite;
        }

        .tagline {
            margin-top: 34px;

            font-size: 0.75rem;
            font-weight: 400;

            letter-spacing: 0.62em;
            text-transform: uppercase;

            opacity: 0.58;
        }

        .contact {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 28px;

            padding-bottom: 34px;
        }

        .contact {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 42px;

    padding-bottom: 42px;
}

.contact-form {
    display: flex;
    align-items: center;

    width: 100%;
    max-width: 420px;

    padding: 6px;

    border-radius: 999px;

    border: 1px solid rgba(197,160,89,0.14);

    background: rgba(255,255,255,0.015);

    backdrop-filter: blur(12px);

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}

.contact-form:focus-within {
    border-color: rgba(197,160,89,0.28);

    box-shadow:
        0 0 24px rgba(197,160,89,0.08);
}

.contact-form input {
    flex: 1;

    padding: 16px 20px;

    background: transparent;
    border: none;
    outline: none;

    color: var(--text);

    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 300;
}

.contact-form input::placeholder {
    color: rgba(197,160,89,0.34);
}

.submit-btn {
    width: 52px;
    height: 52px;

    border-radius: 999px;

    border: none;

    background: rgba(197,160,89,0.08);

    color: var(--text);

    font-size: 1.1rem;

    cursor: pointer;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}

.submit-btn:hover {
    transform: scale(1.06);

    background: rgba(197,160,89,0.16);

    box-shadow:
        0 0 18px rgba(197,160,89,0.14);
}

.socials {
    display: flex;
    align-items: center;

    gap: 30px;
}

.social-link {
    color: rgba(197,160,89,0.42);

    text-decoration: none;

    font-size: 0.78rem;
    font-weight: 500;

    letter-spacing: 0.22em;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        color 0.3s ease;
}

.social-link:hover {
    color: var(--text);

    transform: translateY(-1px);
}

        @keyframes reveal {
            to {
                opacity: 1;

                transform:
                    translateY(0)
                    translateZ(0);
            }
        }

        @keyframes glow {
            0%,
            100% {
                filter:
                    drop-shadow(0 0 4px rgba(197,160,89,0.14));
            }

            50% {
                filter:
                    drop-shadow(0 0 10px rgba(197,160,89,0.22))
                    drop-shadow(0 0 22px rgba(197,160,89,0.12));
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes pageFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 480px) {

            .logo {
                width: 230px;
            }

            .tagline {
                margin-top: 30px;

                font-size: 0.72rem;
                letter-spacing: 0.48em;
            }

            .contact-form {
                flex-direction: column;
                width: 100%;
            }

            .contact-form input {
                width: 100%;
                max-width: 280px;
            }

            .submit-btn {
                width: 100%;
                max-width: 280px;
            }

            .socials {
                gap: 24px;
            }
        }
    </style>
</head>
